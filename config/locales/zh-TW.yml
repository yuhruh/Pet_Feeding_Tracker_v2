  pages:
    about:
      about_aji: 關於阿吉飲食記錄
      note: '如果你對貓咪的飲食行為有興趣，想了解更多，請諮詢專業人士: '
      paragraph1: 這個應用程式的靈感來自於調皮的阿吉 —— 一隻橘白相間、口味超挑的可愛惡魔貓。和大多數的橘貓不同，阿吉有自己獨特的偏好。例如，比起鮪魚或鮭魚,他更愛雞肉。
      paragraph2: "我怎麼知道的呢？我目前用Excel記錄阿吉的每一餐，我慢慢發現阿吉一些飲食上的模式及喜好。如果我給他他不喜歡或不愛的食物……他寧願不吃一直喵喵叫（我：😅）。"
      paragraph3: 你可能會說我寵壞阿吉了 —— 沒錯，我就是這麼愛阿吉。我希望阿吉每一餐都能開心地吃飯，但用Excel太過麻煩而且每筆都得手動輸入，
        也無法輕易看出長期的飲食趨勢。於是我自己動手做了這個應用程式：一個更有效率的方式來記錄餐點、找出喜好，並確保阿吉每餐都可以吃得開心又健康。
      paragraph4: "✨ 想加入我一起記錄你家貓咪的吃貨日常嗎？立即註冊試用看看吧："
      petbuddy: 貼心毛寶:貓行為諮商與訓練
      signup: 註冊
    doc:
      bene_1: '優化貓咪的健康監測: 提供清晰的餵食習慣記錄，幫助主人注意到貓的食慾變化是否由潛在的健康問題所引起。'
      bene_2: '減少手動工作量: 自動帶入當地日期/時間、餵食總量及視覺提醒簡化了資料輸入過程。'
      bene_3: '強化的餵食組織: 可對多隻貓進行餵食紀錄，使所有餵食資訊保持整齊有序。'
      bene_4: '數據導向的決定: 視覺化可使使用戶了解貓咪的飲食趨勢並根據需要調整餵食時間或數量。'
      bene_5: '貓咪本貓化的餵食體驗: 最喜歡的5-10種食物清單功能，使主人根據貓的喜好量身定制飲食，提高惡魔貓貓的滿意度和幸福感。'
      benefit: " 4. 優點"
      col: 第一版
      col2: 第二版
      content_1: 支援多貓：在單一使用者帳戶內可管理「多貓」或「單貓」的餵食數據，並可對每隻寵物進行單獨追蹤及紀錄。(如下圖)
      content_10: "(3)使用者資訊: 除時區以外，可以管理使用者帳戶的詳細信息，包括編輯和刪除使用者資料。"
      content_11: "(4)數據視覺化: 該應用程式包含圖表功能，可幫助用戶更直觀地了解餵食模式/趨勢，並對貓的下一餐做出聰明的決定。"
      content_12: 該應用程式包含圖表功能，可幫助用戶直觀地了解餵食模式和趨勢，從而幫助他們對貓的下一餐做出聰明的決定。
      content_13: 記錄每隻貓咪最愛的5-10種食物，包括品牌和口味。此功能可幫助您追蹤貓咪的飲食偏好，確保您的愛寵開心地享用美食。(如下圖所示)
      content_2: 專用追蹤及圖表欄：針對每隻寵物，該應用程式提供每隻專屬的追蹤介面以及視覺化圖表，以顯示一段時間內的餵食趨勢和數據。
      content_3: 紅色背景提醒：原始資料列會以紅色背景色顯示，提示使用者記得填寫「剩餘食物量」。(如下圖)
      content_4: 黃色背景提醒：資料列會以黃色背景色顯示，提醒使用者填寫「時間記錄（來回吃飯）」欄。(如下圖)
      content_5: 為了簡化紀錄過程，每個餵食紀錄的日期和時間預設為當地時間。
      content_6: 用戶註冊後，應用程式會抓取使用者註冊時的時區，以利使用者紀錄時既便在不同時區，應用程式仍會抓取註冊時的時區日期及時間，避免紀錄時時間錯亂。
      content_7: 使用者可以完全操作自己的數據，如下所示：
      content_8: "(1)餵食紀錄: 可以新增、編輯/更新和刪除單一餵食記錄。"
      content_9: "(2)寵物: 可以新增、編輯/更新和刪除貓的資料。"
      document: "🐾 文件 🐾"
      feature: '支援多貓： '
